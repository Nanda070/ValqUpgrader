# ValqUpgrader — колесо апгрейда предметов.
# Шанс = (1 - house-edge) * (ценность ставки / ценность цели), зажат между min-chance и max-chance.
house-edge: 0.10
min-chance: 0.001
max-chance: 0.90
spin-ticks: 90            # длительность прокрутки (20 тиков = 1 сек)
max-target-count: 64
broadcast-below: 0.10     # объявлять в чат выигрыши с шансом ниже 10%
enchant-level-value: 25   # +ценность за каждый уровень зачарования на ставке

resource-pack:
  url: ""
  sha1: ""
  required: true

# Предметы, которые нельзя выбрать целью.
target-blacklist:
  - bedrock
  - barrier
  - light
  - spawner
  - trial_spawner
  - vault
  - end_portal_frame
  - reinforced_deepslate
  - budding_amethyst
  - debug_stick
  - knowledge_book
  - jigsaw
  - player_head
  - petrified_oak_slab
  - farmland
  - dirt_path
  - frogspawn
  - potion
  - splash_potion
  - lingering_potion
  - tipped_arrow
  - ominous_bottle
  - enchanted_book
  - written_book
  - writable_book
  - filled_map
  - suspicious_stew
  - firework_star
  - goat_horn
  - dragon_egg
  - bundle
  - test_block
  - test_instance_block
  - chorus_plant
  - infested_stone
  - infested_cobblestone
  - infested_stone_bricks
  - infested_mossy_stone_bricks
  - infested_cracked_stone_bricks
  - infested_chiseled_stone_bricks
  - infested_deepslate
  - air

